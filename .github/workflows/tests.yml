name: Source regression tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify and extract reference Windows WD engines
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wd-precompiled.zip'
          Invoke-WebRequest 'https://github.com/Varnani/pywd2015-qt5/releases/download/v1.0.0/wd-precompiled.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '5bfa347dfcaf858e5cf3c3bcd8bbc9adf2ce553906df5a32e0bd519f49279116') {
            throw 'Reference WD archive SHA-256 mismatch'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'wd-reference'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          "PYWD_ENGINE_DIR=$destination/wd-precompiled" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python -m pytest -q
      - run: python -m pip_audit -r requirements.lock --no-deps --disable-pip
